name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mannabooks_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dummy secrets for CI only (long enough to pass the config validator).
      ENVIRONMENT: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mannabooks_ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mannabooks_test
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
      INTERNAL_API_KEY: ci-internal-key-0123456789abcdef0123456789abcdef
      CRON_SECRET: ci-cron-secret-0123456789abcdef
      KRA_ETIMS_AES_ENCRYPTION_KEY: ci-etims-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrate an empty database to head
        run: python -m alembic upgrade head

      - name: Schema matches the models
        run: python scripts/check_schema.py

      - name: Migrations are re-runnable (latest revision applied twice)
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python scripts/check_schema.py

      - name: Create the test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE mannabooks_test"

      - name: Tests
        run: >-
          python -m pytest -q
          tests/test_contracts.py
          tests/test_ledger_posting.py
          tests/test_cashbook.py
          tests/test_security_guards.py
          tests/test_rate_limit.py
          tests/test_refresh_tokens.py
          tests/test_payroll_rates.py
