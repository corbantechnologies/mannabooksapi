[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mannabooksapi"
version = "0.1.0"
description = "MannaBooks Decoupled Backend API and KRA eTIMS Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "bcrypt>=4.2,<6",
    "python-multipart>=0.0.12,<1",
    "pycryptodome>=3.21,<4",
    "tzdata>=2024.1",
    "email-validator>=2.2,<3",
    "PyJWT>=2.8,<3",
    "redis>=5.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "aiosqlite>=0.20,<1",
    "ruff>=0.8",
    "pyflakes>=3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"


